name: V1 regression checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm test
      - run: npm run build
      - name: Windows PowerShell 5.1 operation regressions
        shell: powershell
        run: ./tests/powershell/Run-Regression.ps1
      - name: Windows PowerShell 5.1 gateway recovery
        shell: powershell
        run: ./tests/powershell/Run-GatewayRegression.ps1
